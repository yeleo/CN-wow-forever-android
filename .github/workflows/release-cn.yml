name: Build & Release WoW Forever CN

on:
  push:
    branches:
      - "CN"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CN branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure Android SDK & local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Fetch & Verify Runtime Components
        run: |
          which zstd >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y zstd; }
          chmod +x tools/fetch_components.sh
          ./tools/fetch_components.sh
          echo "=== Verifying Runtime Assets ==="
          file app/src/main/assets/fexcore/*.dll
          file app/src/main/assets/dxvk_x64/*.dll
          ls -la app/src/main/assets/bundled_components

      - name: Build WoW ARM64 Launcher Wrapper & x64 Probe (llvm-mingw)
        run: |
          LLVM_MINGW_VER="20261104"
          LLVM_MINGW_TAR="llvm-mingw-${LLVM_MINGW_VER}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          LLVM_MINGW_URL="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VER}/${LLVM_MINGW_TAR}"
          EXPECTED_SHA256="919380403de87dca3c581c2053230cd298af5e891286628ba0613b7fed370926"

          echo "Downloading llvm-mingw $LLVM_MINGW_VER..."
          curl -fL --retry 3 -o "$LLVM_MINGW_TAR" "$LLVM_MINGW_URL"
          echo "${EXPECTED_SHA256}  ${LLVM_MINGW_TAR}" | sha256sum -c -

          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xJf "$LLVM_MINGW_TAR" -C /opt/llvm-mingw --strip-components=1
          rm -f "$LLVM_MINGW_TAR"

          export PATH="/opt/llvm-mingw/bin:$PATH"
          mkdir -p app/src/main/assets

          # Build ARM64 wrapper (dynamic loading of crypt32, GUI subsystem to prevent black console window)
          aarch64-w64-mingw32-clang -O2 -s -static -mwindows -o app/src/main/assets/Wow-Launcher-ARM64.exe tools/wow_launcher/launcher.c -ladvapi32 -lkernel32
          ls -la app/src/main/assets/Wow-Launcher-ARM64.exe

          # Build x86_64 diagnostic probe (pure Win32 API, zero CRT / UCRT, only links kernel32)
          x86_64-w64-mingw32-clang -O2 -s -fno-builtin -nostdlib -Wl,-e,mainCRTStartup -o app/src/main/assets/x64_probe.exe tools/x64_probe/probe.c -lkernel32
          ls -la app/src/main/assets/x64_probe.exe
          echo "=== DUMPING x64_probe.exe IMPORT TABLE ==="
          x86_64-w64-mingw32-objdump -p app/src/main/assets/x64_probe.exe

      - name: Build APK (assembleModernRelease)
        run: |
          chmod +x gradlew
          ./gradlew assembleModernRelease --no-daemon --stacktrace

      - name: Prepare APK Asset
        id: prepare_asset
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed 's/.*versionName = "\(.*\)".*/\1/')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          APK_NAME="WoW-Forever-CN-v${VERSION}.apk"
          
          BUILT_APK=$(find app/build/outputs/apk/modern/release -type f -name "*.apk" | head -n 1)
          if [ -z "$BUILT_APK" ]; then
            echo "Error: Release APK not found in app/build/outputs/apk/modern/release"
            exit 1
          fi
          
          mkdir -p dist
          cp "$BUILT_APK" "dist/$APK_NAME"
          echo "apk_path=dist/$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload Artifact Backup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_asset.outputs.apk_name }}
          path: ${{ steps.prepare_asset.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v${{ steps.prepare_asset.outputs.version }}-cn-${{ github.run_number }}"
          name: "WoW Forever CN v${{ steps.prepare_asset.outputs.version }} (Build #${{ github.run_number }})"
          body: |
            ### 🎮 WoW Forever Android (国服特供版)
            
            - **版本号**: `v${{ steps.prepare_asset.outputs.version }}`
            - **分支**: `CN` (`${{ steps.prepare_asset.outputs.short_sha }}`)
            - **构建任务**: #${{ github.run_number }}
            
            ---
            
            ### 🌟 本次版本特性
            1. **国服官方 x64 客户端原生支持（彻底解决 WOW51900243 鉴权拒绝）**：
               - 识别并拉取网易/国服专属 x64 客户端（`Wow.exe`，MD5 `96b9b23b...`，Tags 包含 CN 与 x86_64）；优先兼容用户手动放置的文件。
               - 原生 ARM64 PE 启动包装器 `Wow-Launcher-ARM64.exe` 自动感知 `Wow.exe`，优先以 `-d3d11 -launcherlogin -uid wowf` 启动 x64 客户端，消除客户端平台判定差异（`platform="Wn64"` 对齐 PC 成功日志）。
            2. **wowbox64 + Box64 CPU 翻译与 x64 DXVK 运行时**：
               - 适配 Proton 11 ARM64EC 下基于 `wowbox64.dll` 与 `/usr/bin/box64` 的 64 位 x86_64 翻译管道，设置 `HODLL`/`HODLL64` 与 Dynarec 安全参数。
               - 引入 x64 DXVK 2.4.1（AMD64 PE `d3d11.dll` / `dxgi.dll`），随 x64 客户端动态注入 Wine `system32`。
            3. **中国区（国服）原生授权与配置**：
               - 新增 `China (国服)` 区域与网易通行证 OAuth ST 授权流。
               - 包装器 Wine 内 DPAPI 加密并注入国服特供 Launch Options 与 BNA 注册表键。
            4. **安全加固与二进制校验**：
               - 敏感凭证 0 覆写安全粉碎，日志绝对脱敏。
               - 运行时组件全部通过 SHA256 完整性校验。
          files: ${{ steps.prepare_asset.outputs.apk_path }}
          draft: false
          prerelease: false

